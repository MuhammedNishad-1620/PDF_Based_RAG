<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF RAG Assistant</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <h1>PDF RAG Assistant</h1>
    <form id="ragForm" style="margin-bottom: 20px;">
        <input type="text" id="question" placeholder="Ask a question..." style="width: 80%; padding: 10px; font-size: 16px;" required>
        <button type="submit" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Ask</button>
    </form>

    <div id="result">
        <h3>Answer:</h3>
        <p id="answer" style="white-space: pre-wrap; line-height: 1.6;"></p>
        
        <h3>Sources:</h3>
        <div id="sources"></div>
    </div>

    <script>
        document.getElementById('ragForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const answerEl = document.getElementById('answer');
            const sourcesEl = document.getElementById('sources');
            
            answerEl.textContent = 'Thinking...';
            sourcesEl.innerHTML = '';
            
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                
                if (res.ok) {
                    answerEl.textContent = data.answer;
                    if (data.sources && data.sources.length > 0) {
                        data.sources.forEach(src => {
                            const div = document.createElement('div');
                            div.style.border = '1px solid #ccc';
                            div.style.padding = '12px';
                            div.style.margin = '10px 0';
                            div.style.borderRadius = '4px';
                            div.style.background = '#f9f9f9';
                            
                            const meta = src.metadata;
                            const sourceName = meta.source ? meta.source.split(/[/\\]/).pop() : 'Document.pdf';
                            const pageNum = meta.page_num || meta.page || 'unknown';
                            const blockType = meta.block_type || 'text';
                            
                            div.innerHTML = `
                                <strong>Type: ${blockType.toUpperCase()} | Source: ${sourceName} | Page: ${pageNum}</strong>
                                <pre style="white-space: pre-wrap; margin: 8px 0 0 0; font-family: monospace; font-size: 13px; color: #333;">${src.content}</pre>
                            `;
                            sourcesEl.appendChild(div);
                        });
                    } else {
                        sourcesEl.textContent = 'No sources retrieved.';
                    }
                } else {
                    answerEl.textContent = 'Error: ' + (data.error || 'Unknown error');
                }
            } catch (err) {
                answerEl.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
